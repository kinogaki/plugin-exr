[package]
name = "kinogaki-exr-format"
description = "OpenEXR as a format plugin on the Kinogaki Studio SDK: its codec (scanline and tiled, multi-part, every lossless compression and PXR24, Cryptomatte), a file read as one standard Image of every part's layers, and an Image written as one file"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"

# The format builds from its own repository, the public SDK's and lib-image's
# alone, checked out side by side as Studio's tree lays them out (README
# "Building"): its manifest names everything it needs instead of inheriting
# it from the tree.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[dependencies]
kinogaki-studio-api = { path = "../../sdk/crates/api" }
# Output names of render layers and Cryptomatte's metadata keys.
kinogaki-render-api = { path = "../../sdk/crates/render-api" }
# ZIP, ZIPS and PXR24's zlib (lib-image's).
kinogaki-deflate = { path = "../../libs/lib-image/crates/deflate" }
# The interleaved image the codec converts parts to and from (lib-image's).
kinogaki-image = { path = "../../libs/lib-image/crates/image" }

[dev-dependencies]
# The SDK's color service that converts nothing.
kinogaki-studio-api-testing = { path = "../../sdk/crates/api-testing" }
